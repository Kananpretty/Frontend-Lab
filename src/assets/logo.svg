<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 400" width="100%" height="100%">
  <defs>
    <!-- Cyan to Blue Gradient -->
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2B4"/>
      <stop offset="100%" stop-color="#2196F3"/>
    </linearGradient>

    <!-- Deep Blue Gradient -->
    <linearGradient id="kArmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ==================== ICON GROUP ==================== -->
  <g transform="translate(40, -55)" filter="url(#shadow)">
    <!-- Left Bracket < -->
    <path d="M110 220 L50 280 L110 340" 
          stroke="#00D2B4" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Bracket > -->
    <path d="M290 220 L350 280 L290 340" 
          stroke="#2196F3" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stylized "K" Vertical Stem -->
    <rect x="130" y="190" width="28" height="180" rx="14" fill="#00D2B4"/>

    <!-- Stylized "K" Upper Wing -->
    <path d="M150 290 L245 195" 
          stroke="url(#kArmGrad)" stroke-width="30" stroke-linecap="round"/>

    <!-- Stylized "K" Lower Wing -->
    <path d="M165 275 L255 370" 
          stroke="#0077B6" stroke-width="30" stroke-linecap="round"/>

    <!-- Chemical Flask Body -->
    <path d="M182 220 
             L182 238 
             L148 318 
             C140 338 154 358 176 358 
             L224 358 
             C246 358 260 338 252 318 
             L218 238 
             L218 220 Z" 
          fill="url(#flaskGrad)" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>

    <!-- Flask Rim -->
    <rect x="174" y="212" width="52" height="10" rx="5" fill="#FFFFFF"/>

    <!-- Liquid Inside Flask -->
    <path d="M158 306 Q178 318 200 310 T242 306 L248 326 C244 342 230 350 218 350 L182 350 C170 350 156 342 152 326 Z" 
          fill="#FFFFFF" opacity="0.4"/>

    <!-- Floating Lab Bubbles -->
    <circle cx="200" cy="285" r="7" fill="#FFFFFF"/>
    <circle cx="186" cy="260" r="5" fill="#FFFFFF"/>
    <circle cx="210" cy="235" r="4" fill="#FFFFFF"/>
    <circle cx="198" cy="188" r="8" fill="#00D2B4"/>
    <circle cx="214" cy="172" r="5" fill="#2196F3"/>
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <g transform="translate(430, 215)">
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="2" 
          fill="#1E293B">KANAN'S</text>
          
    <text x="0" y="70" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="54" 
          font-weight="800" 
          letter-spacing="6" 
          fill="#334155">FRONTEND LAB</text>
  </g>
</svg>
